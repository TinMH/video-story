name: aistory

services:
  postgres:
    image: postgres:16-alpine
    container_name: aistory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aistory
      POSTGRES_PASSWORD: aistory_dev_password
      POSTGRES_DB: aistory_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aistory" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aistory_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: